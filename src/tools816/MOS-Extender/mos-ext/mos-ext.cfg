MEMORY {
    ZP:       file = "", start = $0070,   size = $001A;
    MAIN:     file = %O, start = $1900,   size = $0900, fill = yes;
    NATV:     file = "", start = $8C00,   size = $01E0;
    NATH:     file = %O, start = $FF2200, size = $0B00;
    BSS:      file = "", start = $2D00,   size = $0300;
}
SEGMENTS {
    ZEROPAGE:   load = ZP,   type = zp;
    STARTUP:    load = MAIN, type = ro;
    CODE:       load = MAIN, type = ro;
    RODATA:     load = MAIN, type = ro;
    DATA:       load = MAIN, type = rw;
    NATWKSP:    load = MAIN, run = NATV, type = ro, define = yes;
    NATHANDLER: load = NATH, type = ro;
    BSS:        load = BSS,  type = bss;
}
SYMBOLS {
    _nat_wksp_start: type = export, value = __NATWKSP_LOAD__;
    _nat_wksp_len:   type = export, value = __NATWKSP_SIZE__;
}
