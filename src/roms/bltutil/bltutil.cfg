MEMORY {
    WKSP_TMP:       start = $2E00, size = $0010, type = rw, define = yes;
    ROM: 		    start = $8000, size = $3A00, file = %O, fill=yes, fillval=$FF;
    ROM_EXTRA:      start = $BA00, size = $0600, file = %O, fill=yes, fillval=$FF;
    RAM_TRANS_FL:   start = $2000, size = $500, define=yes;
}
SEGMENTS {
    CODE_ROMHEADER:     load = ROM, type = ro;
    CODE:     	        load = ROM, type = ro;
    RODATA:	            load = ROM_EXTRA, type = ro;
    WKSP_HAZEL:         load = WKSP_TMP,  type = bss;

    CODE_FLASH:         load = ROM, run = RAM_TRANS_FL, define=yes;

}
FEATURES {
}
SYMBOLS {
}